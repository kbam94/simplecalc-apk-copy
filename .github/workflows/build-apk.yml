name: Build APK & Web Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Project
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
          fi
          echo "==> Displaying root APK and web targets:"
          ls -la *.apk *.html *.js 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simplecalc-apk-artifacts
          path: |
            *.apk
            *.html
            *.js
            dist/
            build/
            www/
          if-no-files-found: error
